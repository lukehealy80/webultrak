<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/64daysofstarman/ultrakill-webport-compiled/refs/heads/main/images/favicon.png">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>WEB PORT</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; background-color: #000;">
    <canvas id="unity-canvas" width="1280" height="720" style="width: 1280px; height: 720px; background: #231F20"></canvas>
    
    <script src="Build/ultrakill.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/ultrakill.data.unityweb",
        frameworkUrl: "Build/ultrakill.framework.js.unityweb",
        codeUrl: "Build/ultrakill.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hakita and Cake Logic",
        productName: "WEB PORT",
        productVersion: "1.4",
      });
    </script>

    <!-- Save Data Management UI -->
    <div style="text-align: center; margin-top: 15px; margin-bottom: 20px;">
      <button onclick="exportSaveData()" style="padding: 10px 20px; margin-right: 10px; cursor: pointer; font-weight: bold;">💾 Backup Save File</button>
      <button onclick="document.getElementById('importFile').click()" style="padding: 10px 20px; cursor: pointer; font-weight: bold;">📂 Restore Save File</button>
      <input type="file" id="importFile" style="display: none;" onchange="importSaveData(event)" accept=".json">
    </div>

    <script>
      // Export IndexedDB /idbfs save data to a downloadable JSON file
      function exportSaveData() {
        const request = indexedDB.open('/idbfs');
        request.onsuccess = function(event) {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('FILE_DATA')) {
            alert("No save data found yet! Play until a checkpoint first.");
            return;
          }
          const transaction = db.transaction(['FILE_DATA'], 'readonly');
          const store = transaction.objectStore('FILE_DATA');
          const keysReq = store.getAllKeys();
          const valsReq = store.getAll();

          transaction.oncomplete = function() {
            const keys = keysReq.result;
            const vals = valsReq.result;
            if (!keys || keys.length === 0) {
              alert("No save files found to export.");
              return;
            }

            const dump = {};
            for (let i = 0; i < keys.length; i++) {
              const val = vals[i];
              const rawContents = (val && val.contents) ? val.contents : val;
              if (rawContents) {
                dump[keys[i]] = Array.from(new Uint8Array(rawContents));
              }
            }

            const blob = new Blob([JSON.stringify(dump)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ultrakill_save_backup.json';
            a.click();
          };
        };
        request.onerror = function() {
          alert("Error accessing browser save storage.");
        };
      }

      // Import JSON save file back into IndexedDB /idbfs with Emscripten metadata structure
      function importSaveData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const dump = JSON.parse(e.target.result);
            const request = indexedDB.open('/idbfs');

            request.onsuccess = function(evt) {
              const db = evt.target.result;
              const transaction = db.transaction(['FILE_DATA'], 'readwrite');
              const store = transaction.objectStore('FILE_DATA');

              for (const key in dump) {
                const dataArray = new Uint8Array(dump[key]);
                // Format with the timestamp object structure expected by Unity's filesystem
                const fileNode = {
                  timestamp: new Date(),
                  contents: dataArray
                };
                store.put(fileNode, key);
              }

              transaction.oncomplete = function() {
                alert("Save data restored successfully! Refreshing game...");
                window.location.reload();
              };
            };
          } catch (err) {
            alert("Invalid or corrupted save file.");
          }
        };
        reader.readAsText(file);
      }
    </script>
  </body>
</html>
